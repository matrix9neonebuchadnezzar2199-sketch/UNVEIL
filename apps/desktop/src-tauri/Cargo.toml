[package]
name = "unveil"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UNVEIL desktop shell (Tauri). UI has no filesystem or command privileges."

[lib]
name = "unveil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
unveil-contracts = { path = "../../../crates/contracts" }
unveil-coordinator = { path = "../../../crates/coordinator" }
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
